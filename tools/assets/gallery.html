<!doctype html><html lang="en"><meta charset="utf-8"><title>Darkspawn asset gallery</title>
<style>body{margin:0;background:#111a21;color:#d9e7eb;font:15px system-ui}header{padding:12px 20px;display:flex;gap:16px;align-items:center}h1{font-size:20px;margin:0}select,button{font:inherit;padding:7px;background:#243943;color:#e3f1f5;border:1px solid #54717d;border-radius:5px}main{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:calc(100vh - 65px);gap:3px}article{position:relative;background:#182730}a{position:absolute;top:10px;left:12px;z-index:1;color:#d9e7eb;text-decoration:none;text-transform:capitalize}iframe{width:100%;height:100%;border:0}</style>
<header><h1>Darkspawn · Asset gallery</h1><select aria-label="Collection" id="collection"></select><span id="status">Loading</span></header>
<nav style="padding:0 20px 12px;display:flex;gap:16px;align-items:center"><label>Animation <select id="animation"><option>idle</option><option>walk</option><option>warning</option><option>attack</option><option>active</option><option>hide</option><option>death</option><option>blink</option><option>wrath_idle</option><option>phase_change</option><option>boss_warning</option><option>boss_attack</option></select></label><label>Pose <input id="progress" type="range" min="0" max="1" step="0.01" value="0.5"></label><label><input id="playing" type="checkbox"> Play</label><small>Unavailable clips show idle.</small></nav><main id="grid" style="height:calc(100vh - 120px)"></main>
<script>
let catalog=[],pages=[],ready=new Set(),current=[];const list=document.getElementById('collection'),grid=document.getElementById('grid'),status=document.getElementById('status');
fetch('/art/blockbench/catalog.json').then(r=>r.json()).then(data=>{catalog=data.creatures;const mobs=catalog.filter(e=>e.category!=='boss'&&!e.preserve);for(let i=0;i<mobs.length;i+=6)pages.push(mobs.slice(i,i+6));const labels=pages.map((_,i)=>'Creatures '+(i*6+1)+'–'+Math.min(i*6+6,mobs.length));const bosses=catalog.filter(e=>e.category==='boss');for(let i=0;i<bosses.length;i+=6){pages.push(bosses.slice(i,i+6));labels.push('Bosses '+(i+1)+'–'+Math.min(i+6,bosses.length));}const hive=catalog.filter(e=>e.region==='shadow_creeper_queen'&&e.category!=='boss');for(let i=0;i<hive.length;i+=6){pages.push(hive.slice(i,i+6));labels.push('Shadow hive '+(i+1)+'–'+Math.min(i+6,hive.length));}pages.push(catalog.filter(e=>e.id==='endborn'));labels.push('Endborn');list.replaceChildren(...labels.map((label,i)=>new Option(label,i)));show();});
function show(){ready=new Set();current=pages[Number(list.value)];status.textContent='Loading';grid.replaceChildren(...current.map(e=>{const card=document.createElement('article'),link=document.createElement('a'),frame=document.createElement('iframe');link.textContent=e.id.replaceAll('_',' ');link.href='/tools/assets/preview.html?id='+e.id;link.target='_blank';frame.title=e.id.replaceAll('_',' ');frame.src='/tools/assets/preview.html?id='+e.id+'&compact=1';card.append(link,frame);return card;}));}
function animateGallery(){const data={type:'animation-preview',clip:document.getElementById('animation').value,progress:Number(document.getElementById('progress').value),playing:document.getElementById('playing').checked};grid.querySelectorAll('iframe').forEach(frame=>frame.contentWindow.postMessage(data,location.origin));}
document.getElementById('animation').onchange=animateGallery;document.getElementById('progress').oninput=()=>{document.getElementById('playing').checked=false;animateGallery();};document.getElementById('playing').onchange=animateGallery;
list.onchange=show;window.addEventListener('message',event=>{if(event.origin!==location.origin||!current.some(e=>e.id===event.data?.assetReady)||![...grid.querySelectorAll('iframe')].some(f=>f.contentWindow===event.source))return;ready.add(event.data.assetReady);status.textContent=ready.size+'/'+current.length+' ready';animateGallery();});
</script></html>
