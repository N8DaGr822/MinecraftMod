<!doctype html><html lang="en"><meta charset="utf-8"><title>Darkspawn asset gallery</title>
<style>body{margin:0;background:#111a21;color:#d9e7eb;font:15px system-ui}header{padding:12px 20px;display:flex;gap:16px;align-items:center}h1{font-size:20px;margin:0}select,button{font:inherit;padding:7px;background:#243943;color:#e3f1f5;border:1px solid #54717d;border-radius:5px}main{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:calc(100vh - 65px);gap:3px}article{position:relative;background:#182730}a{position:absolute;top:10px;left:12px;z-index:1;color:#d9e7eb;text-decoration:none;text-transform:capitalize}iframe{width:100%;height:100%;border:0}</style>
<header><h1>Darkspawn · Asset gallery</h1><select aria-label="Collection" id="collection"></select><span id="status">Loading</span></header><main id="grid"></main>
<script>
let catalog=[],pages=[],ready=new Set(),current=[];const list=document.getElementById('collection'),grid=document.getElementById('grid'),status=document.getElementById('status');
fetch('/art/blockbench/catalog.json').then(r=>r.json()).then(data=>{catalog=data.creatures;const mobs=catalog.filter(e=>e.category!=='boss'&&!e.preserve);for(let i=0;i<mobs.length;i+=6)pages.push(mobs.slice(i,i+6));list.replaceChildren(...pages.map((_,i)=>new Option('Creatures '+(i*6+1)+'–'+Math.min(i*6+6,mobs.length),i)));show();});
function show(){ready=new Set();current=pages[Number(list.value)];status.textContent='Loading';grid.replaceChildren(...current.map(e=>{const card=document.createElement('article'),link=document.createElement('a'),frame=document.createElement('iframe');link.textContent=e.id.replaceAll('_',' ');link.href='/tools/assets/preview.html?id='+e.id;link.target='_blank';frame.title=e.id.replaceAll('_',' ');frame.src='/tools/assets/preview.html?id='+e.id+'&compact=1';card.append(link,frame);return card;}));}
list.onchange=show;window.addEventListener('message',event=>{if(event.origin!==location.origin||!current.some(e=>e.id===event.data?.assetReady))return;ready.add(event.data.assetReady);status.textContent=ready.size+'/'+current.length+' ready';});
</script></html>
