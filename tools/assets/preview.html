<!doctype html><html lang="en"><meta charset="utf-8"><title>Darkspawn creature assets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111a21;color:#d9e7eb;font:15px system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:20px;background:#182730}h1{font-size:21px;margin:0}select,button,input{font:inherit}select,button{padding:8px;background:#243943;color:#e3f1f5;border:1px solid #54717d;border-radius:5px}main{display:grid;grid-template-columns:1fr 290px;height:calc(100vh - 77px)}canvas{width:100%;height:100%;min-height:500px}aside{padding:24px;background:#15232c}label{display:block;margin:18px 0 8px;color:#acc7d3}input[type=range]{width:100%}p{line-height:1.55;color:#abc0c9}#status{font-size:13px}#time{font-variant-numeric:tabular-nums}a{color:#8ddce2}
</style>
<header><h1>Darkspawn · Creature workshop</h1><select id="creature" aria-label="Creature"></select><span id="status">Loading catalog…</span></header>
<main><canvas id="scene" aria-label="Animated creature preview"></canvas><aside>
<h2 id="name">Creature</h2><p id="details"></p><label for="clip">Animation</label><select id="clip"></select>
<label for="scrub">Timeline <span id="time"></span></label><input id="scrub" type="range" min="0" max="1" value="0" step="0.01"><button id="play">Pause</button>
<label for="yaw">Rotate</label><input id="yaw" type="range" min="-180" max="180" value="-32">
<label for="pitch">Elevation</label><input id="pitch" type="range" min="-5" max="75" value="15">
<label for="zoom">Zoom</label><input id="zoom" type="range" min="0.5" max="2" value="1" step="0.05">
<p>Source model preview. The gold marker is two blocks tall. Minecraft collision, lighting and combat still require a game client.</p><a id="project">Open project file</a><p id="error" role="alert"></p>
</aside></main>
<script>
const compact=new URLSearchParams(location.search).has('compact');if(compact){const style=document.createElement('style');style.textContent='header,aside{display:none}main{display:block;height:100vh}canvas{min-height:0}';document.head.append(style);}
const $=id=>document.getElementById(id), canvas=$('scene'),ctx=canvas.getContext('2d');
let model,texture,entry,groups,parents,cubeParents,clip,clock=0,playing=true,previous=performance.now(),bounds;
const faces=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
const names=['north','south','west','east','up','down'];
function rotate(v,r){let [x,y,z]=v;for(let a=0;a<3;a++){const c=Math.cos(r[a]*Math.PI/180),s=Math.sin(r[a]*Math.PI/180);if(a===0)[y,z]=[y*c-z*s,y*s+z*c];if(a===1)[x,z]=[x*c+z*s,-x*s+z*c];if(a===2)[x,y]=[x*c-y*s,x*s+y*c];}return[x,y,z];}
function values(animator,channel,t){const frames=(animator?.keyframes||[]).filter(f=>f.channel===channel).sort((a,b)=>a.time-b.time),base=channel==='scale'?[1,1,1]:[0,0,0];if(!frames.length)return base;const read=f=>['x','y','z'].map(a=>Number(f.data_points[0][a])||0);if(t<=frames[0].time)return read(frames[0]);for(let i=1;i<frames.length;i++)if(t<=frames[i].time){const p=frames[i-1],n=frames[i],d=(t-p.time)/(n.time-p.time);return read(p).map((v,a)=>v+(read(n)[a]-v)*d);}return read(frames.at(-1));}
function transform(v,id,t){if(!id)return v;const g=groups.get(id),a=clip?.animators?.[id],p=g.origin||[0,0,0],s=values(a,'scale',t),r=values(a,'rotation',t).map((v,i)=>v+(g.rotation?.[i]||0)),move=values(a,'position',t);v=rotate(v.map((n,i)=>(n-p[i])*s[i]),r).map((n,i)=>n+p[i]+move[i]);return transform(v,parents.get(id),t);}
function camera(v){const yaw=Number($('yaw').value)*Math.PI/180,pitch=Number($('pitch').value)*Math.PI/180,c=Math.cos(yaw),s=Math.sin(yaw);let x=v[0]*c+v[2]*s,z=-v[0]*s+v[2]*c,y=v[1]-bounds.center;return [x,y*Math.cos(pitch)+z*Math.sin(pitch),z*Math.cos(pitch)-y*Math.sin(pitch)];}
function project(v){const c=camera(v),scale=Math.min(canvas.width,canvas.height)*.7/bounds.span*Number($('zoom').value);return[canvas.width/2+c[0]*scale,canvas.height*.51-c[1]*scale,c[2]];}
function uv(c,face){if(!c.box_uv&&c.faces?.[face])return c.faces[face].uv;const [u,v]=c.uv_offset||[0,0],w=c.to[0]-c.from[0],h=c.to[1]-c.from[1],d=c.to[2]-c.from[2];return {north:[u+d,v+d,u+d+w,v+d+h],south:[u+2*d+w,v+d,u+2*d+2*w,v+d+h],west:[u,v+d,u+d,v+d+h],east:[u+d+w,v+d,u+2*d+w,v+d+h],up:[u+d,v,u+d+w,v+d],down:[u+d+w,v,u+2*w+d,v+d]}[face];}
function triangle(points,coords){const [a,b,c]=points,[p,q,r]=coords,det=p[0]*(q[1]-r[1])+q[0]*(r[1]-p[1])+r[0]*(p[1]-q[1]);if(Math.abs(det)<.00001)return;const coeff=k=>[(a[k]*(q[1]-r[1])+b[k]*(r[1]-p[1])+c[k]*(p[1]-q[1]))/det,(a[k]*(r[0]-q[0])+b[k]*(p[0]-r[0])+c[k]*(q[0]-p[0]))/det,(a[k]*(q[0]*r[1]-r[0]*q[1])+b[k]*(r[0]*p[1]-p[0]*r[1])+c[k]*(p[0]*q[1]-q[0]*p[1]))/det];const x=coeff(0),y=coeff(1);ctx.save();ctx.beginPath();ctx.moveTo(...a.slice(0,2));ctx.lineTo(...b.slice(0,2));ctx.lineTo(...c.slice(0,2));ctx.closePath();ctx.clip();ctx.transform(x[0],y[0],x[1],y[1],x[2],y[2]);ctx.drawImage(texture,0,0);ctx.restore();}
function visible(id){if(!id)return true;return groups.get(id).visibility!==false&&visible(parents.get(id));}
function draw(t){const rect=canvas.getBoundingClientRect();canvas.width=rect.width;canvas.height=rect.height;ctx.fillStyle='#111a21';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;if(!model||!texture)return;const grid=bounds.span*.65;ctx.strokeStyle='#2c414b';ctx.lineWidth=1;for(let i=-5;i<=5;i++){for(const pair of [[[i*grid/5,0,-grid],[i*grid/5,0,grid]],[[-grid,0,i*grid/5],[grid,0,i*grid/5]]]){ctx.beginPath();pair.map(project).forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}}
 const quads=[];for(const c of model.elements){if(c.visibility===false||!visible(cubeParents.get(c.uuid)))continue;const [x,y,z]=c.from,[X,Y,Z]=c.to;const raw=[[x,y,z],[X,y,z],[X,Y,z],[x,Y,z],[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]];const points=raw.map(p=>{if(c.rotation?.some(n=>n)){const o=c.origin||[0,0,0];p=rotate(p.map((v,i)=>v-o[i]),c.rotation).map((v,i)=>v+o[i]);}return project(transform(p,cubeParents.get(c.uuid),t).map(v=>v*(entry.modelScale||1)));});faces.forEach((indices,index)=>{const pts=indices.map(i=>points[i]);quads.push({pts,c,face:names[index],shade:[.09,.24,.19,.04,0,.32][index],depth:pts.reduce((v,p)=>v+p[2],0)/4});});}
 quads.sort((a,b)=>b.depth-a.depth);for(const q of quads){const [u,v,U,V]=uv(q.c,q.face),sx=texture.width/model.resolution.width,sy=texture.height/model.resolution.height,coords=[[u*sx,V*sy],[U*sx,V*sy],[U*sx,v*sy],[u*sx,v*sy]];triangle([q.pts[0],q.pts[1],q.pts[2]],[coords[0],coords[1],coords[2]]);triangle([q.pts[0],q.pts[2],q.pts[3]],[coords[0],coords[2],coords[3]]);ctx.beginPath();q.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=`rgba(0,0,0,${q.shade})`;ctx.fill();ctx.strokeStyle='#060d1438';ctx.stroke();}
 const marker=[-bounds.span*.55,0,0];const a=project(marker),b=project([marker[0],32,0]);ctx.strokeStyle='#e5bb68';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.fillStyle='#e5bb68';ctx.font='12px system-ui';ctx.fillText('2 blocks',a[0]-22,a[1]+18);
 $('time').textContent=t.toFixed(2)+' s';$('scrub').value=t;
}
async function load(id){$('error').textContent='';try{entry=catalog.find(e=>e.id===id);const title=id.split('_').map(v=>v[0].toUpperCase()+v.slice(1)).join(''),file=`/art/blockbench/${id}/${title}.bbmodel`;const response=await fetch(file);if(!response.ok)throw Error('Project not yet authored: '+id);model=await response.json();groups=new Map(model.groups.map(g=>[g.uuid,g]));parents=new Map();cubeParents=new Map();function visit(node,parent){if(typeof node==='string'){cubeParents.set(node,parent);return;}parents.set(node.uuid,parent);node.children.forEach(c=>visit(c,node.uuid));}model.outliner.forEach(n=>visit(n));let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const c of model.elements)for(let a=0;a<3;a++){min[a]=Math.min(min[a],c.from[a]);max[a]=Math.max(max[a],c.to[a]);}bounds={center:(min[1]+max[1])/2*(entry.modelScale||1),span:Math.max(...max.map((v,i)=>v-min[i]))*(entry.modelScale||1)};texture=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=model.textures[0].source;});$('clip').replaceChildren(...model.animations.map((a,i)=>new Option(a.name.split('.').at(-1),i)));$('name').textContent=id.replaceAll('_',' ');$('details').textContent=`${entry.height} blocks tall · ${model.elements.length} cuboids · ${model.groups.length} bones · ${model.animations.length} clips`;$('project').href=file;$('status').textContent=entry.category+' · '+entry.region.replaceAll('_',' ');selectClip();if(compact){playing=false;draw(0);parent.postMessage({assetReady:id},location.origin);}}catch(e){model=null;texture=null;clip=null;$('name').textContent=id.replaceAll('_',' ');$('details').textContent='';$('clip').replaceChildren();$('project').removeAttribute('href');$('error').textContent=e.message;}}
function selectClip(){clip=model.animations[Number($('clip').value)];clock=0;$('scrub').max=clip?.length||1;}
let catalog=[];fetch('/art/blockbench/catalog.json').then(r=>r.json()).then(data=>{catalog=data.creatures;$('creature').replaceChildren(...catalog.map(e=>new Option(e.id.replaceAll('_',' '),e.id)));const first=new URLSearchParams(location.search).get('id')||'mutant_zombie';$('creature').value=first;load(first);});
$('creature').onchange=()=>load($('creature').value);$('clip').onchange=selectClip;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};$('scrub').oninput=()=>{playing=false;$('play').textContent='Play';clock=Number($('scrub').value);};function frame(now){if(playing&&clip){clock+=(now-previous)/1000;if(clock>clip.length)clock=clip.loop==='loop'?clock%clip.length:clip.length;}previous=now;if(!compact)draw(clock);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
