plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	exclusiveContent {
		forRepository {
			maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
		}
		filter { includeGroupAndSubgroups('com.geckolib') }
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"darkspawn" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'darkspawn-gametest'
		enableGameTests = true
		enableClientGameTests = false
	}
	configureDataGeneration {
		client = true
		modId = "darkspawn"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
	// Model tests load client classes as well as the common mod classes.
	classpath += sourceSets.client.output
	systemProperty 'fabric.classPathGroups', (sourceSets.main.output.files + sourceSets.client.output.files).collect { it.absolutePath }.join(File.pathSeparator)
	maxParallelForks = 1
	jvmArgs '-XX:ActiveProcessorCount=2'
}

def gameTestFilter = providers.gradleProperty('gameTestFilter')
tasks.named('runGameTest') {
	// Avoid competing Minecraft/JUnit processes on development machines.
	mustRunAfter tasks.named('test')
	jvmArgs '-XX:ActiveProcessorCount=2'
	if (gameTestFilter.isPresent()) {
		if (gameTestFilter.get().isBlank()) throw new GradleException('gameTestFilter must not be blank')
		systemProperty 'fabric-api.gametest.filter', gameTestFilter.get()
	}
}

tasks.register('playBuild') {
	group = 'build'
	description = 'Build the playable JAR without starting unit tests or a GameTest server.'
	dependsOn tasks.named('assemble')
}

tasks.register('checkCuisineArt', Exec) {
	group = 'verification'
	description = 'Check cuisine models, textures and item references without starting Minecraft.'
	commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'), 'tools/assets/verify-cuisine-art.py'
}

tasks.register('fullCheck') {
	group = 'verification'
	description = 'Pre-push checks without packaging: all unit tests, server GameTests and cuisine assets.'
	dependsOn tasks.named('check'), tasks.named('test'), tasks.named('runGameTest'), tasks.named('checkCuisineArt')
}

// A pre-push run must not accidentally inherit a narrowed server-test selection.
if (gameTestFilter.isPresent() && gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['fullCheck', 'build', 'check'] }) {
	throw new GradleException('Use runGameTest with -PgameTestFilter for targeted checks; fullCheck/build/check must be unfiltered.')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
